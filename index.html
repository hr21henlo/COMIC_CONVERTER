<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComicGen | Article to Comic Converter</title>
    <meta name="description" content="Transform long articles into stunning visual comic strips using AI." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://esm.run; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://ai.api.nvidia.com;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Dynamic Starry Sky Background -->
    <div class="starry-sky-bg">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </div>

    <div id="app">
      <header>
        <div class="logo">
          <div class="logo-loader">
            <div class="loader">
              <div class="box1"></div>
              <div class="box2"></div>
              <div class="box3"></div>
            </div>
          </div>
          <span class="comic-text">COMIC</span><span class="accent-text">GEN</span>
        </div>
      </header>

      <main>
        
        <!-- AI Visual News Hub Section -->
        <section class="news-reader-section glass-container">
          <div class="news-header">
            <h2 class="section-title"><span class="gradient-text"></span></h2>
            <p class="section-subtitle"></p>
          </div>
          
          <div class="news-controls">

                <input id="cat-trending" name="news-category" type="radio" checked="checked" />

                <span class="label-text">Sports</span>
              </label>
              
              <label title="Gaming" for="cat-gaming" class="pill" data-category="gaming">
                <input id="cat-gaming" name="news-category" type="radio" />

                  <path fill="inherit" d="M14.44 0C12.63 0 11.01 0.88 10 2.23C9.48413 1.53881 8.81426 0.977391 8.04353 0.590295C7.27281 0.203198 6.42247 0.00108555 5.56 0C2.49 0 0 2.5 0 5.59C0 6.78 0.19 7.88 0.52 8.9C2.1 13.9 6.97 16.89 9.38 17.71C9.72 17.83 10.28 17.83 10.62 17.71C13.03 16.89 17.9 13.9 19.48 8.9C19.81 7.88 20 6.78 20 5.59C20 2.5 17.51 0 14.44 0Z"></path>

              </label>
              
              <label title="Science" for="cat-science" class="pill" data-category="science">
                <input id="cat-science" name="news-category" type="radio" />
                <svg xmlns="http://www.w3.org/2000/svg" fill="inherit" viewBox="0 0 24 24" height="20" width="20" class="icon science">
                  <path fill="inherit" d="M18.94 5.06a8.49 8.49 0 0 0-6.01-2.49 8.49 8.49 0 0 0-6.01 2.49 8.46 8.46 0 0 0-2.43 6.07c0 1.25.27 2.48.81 3.59L3.19 16.8c-.8.8-.8 2.07 0 2.87.39.4.92.62 1.44.62s1.04-.22 1.44-.62l2.09-2.09c1.11.54 2.34.81 3.59.81 2.27 0 4.41-.89 6.01-2.49A8.49 8.49 0 0 0 20.25 11a8.49 8.49 0 0 0-1.31-5.94zm-6.19 6.19c-.39.39-.9.59-1.41.59s-1.02-.2-1.41-.59a1.996 1.996 0 0 1 0-2.83 1.996 1.996 0 0 1 2.83 0c.78.78.78 2.05 0 2.83z"></path>
                </svg>
                <span class="label-text">Science</span>
              </label>
            </div>
            
            <!-- Dynamic Search Input -->
            <div class="search-box">
              <input type="text" id="newsSearch" placeholder="Search news stories..." />
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
          </div>
          
          <!-- Arched Cover Flow Deck -->
          <div class="fan-deck-container">
            <button class="fan-deck-nav prev" id="fanPrev" aria-label="Previous Article">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div id="newsFanDeck" class="news-fan-deck">
              <!-- News cards dynamically positioned in a fan layout -->
            </div>
            <button class="fan-deck-nav next" id="fanNext" aria-label="Next Article">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>

          <!-- Dynamic News Detail Main Box -->
          <div id="newsDetailContainer" class="news-detail-container" style="display: none;">
            <!-- Article details will be injected here directly in layout -->
          </div>
        </section>

        <!-- Spacer header for Custom Article Converter -->
        <div class="custom-converter-header">
          <h3 class="comic-text">OR CONVERT ANY CUSTOM TEXT</h3>
        </div>

                <label class="label spring">
                  <input type="radio" name="characterStyle" value="typical comic character" checked="checked" />
                  <span class="text spring">Comic</span>
                </label>
                <label class="label summer">
                  <input type="radio" name="characterStyle" value="anime" />
                  <span class="text summer">Anime</span>
                </label>
                <label class="label autumn">
                  <input type="radio" name="characterStyle" value="stick man characters" />
                  <span class="text autumn">Stick Man</span>
                </label>
                <label class="label winter">
                  <input type="radio" name="characterStyle" value="custom characters" />
                  <span class="text winter">Custom</span>
                </label>
                <div class="center"></div>
              </div>
              <textarea id="articleInput" placeholder="Paste your article or story here... (Minimum 100 words recommended for best results)"></textarea>

                  </div>

                      </svg>
                    </button>
                    <span id="generateText" style="font-size: 0.65rem; font-weight: bold; letter-spacing: 1px; color: var(--text-muted);">GENERATE</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Right Side: Result -->
          <section id="resultSection" class="result-section" style="display: none;">
            <div class="status-indicator">
              <div id="statusText">Brewing your story...</div>
              <div class="loadingspinner" id="mainLoader">
                <div id="square1"></div>
                <div id="square2"></div>
                <div id="square3"></div>
                <div id="square4"></div>
                <div id="square5"></div>
              </div>
            </div>
            
            <!-- This will hold the dynamic comic layouts -->
            <div id="comicPage" class="comic-page">
              <div id="comicGrid" class="comic-grid">
                <!-- Panels will be injected here -->
              </div>
            </div>

            <div class="final-actions" style="display: none;">
              <button id="downloadBtn" class="btn-secondary">Download Strip</button>
              <button id="shareBtn" class="btn-ghost">Share</button>
            </div>
          </section>
        </div>

        <section class="brutalist-section">
          <div class="brutalist-text-block">
            <h2 class="brutalist-headline">
              WE <img src="./comicGEN sticker.png" class="tiny-sticker" alt="Comic Gen"> HELP CREATE<br>
              VISUAL EPICS<br>
              FROM YOUR <img src="./comicGEN sticker.png" class="tiny-sticker" alt="Comic Gen"> TEXT<br>
              INSTANTLY <img src="./comicGEN sticker.png" class="tiny-sticker" alt="Comic Gen">
            </h2>
          </div>
        </section>
      </main>
      
      <!-- Seamless Scrolling Marquee at the very bottom -->
      <div class="marquee-container">
        <div class="marquee-content">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">

          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <!-- Duplicated for seamless loop -->
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">
          <img src="./comicGEN sticker.png" alt="Comic Gen Sticker">

      </div>
    </div>

    <!-- Obsolete News Overlay Modal removed - Detail Hub is now in-layout -->
